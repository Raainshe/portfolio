name: Deploy to Digital Ocean

on:
  push:
    branches: [ main, languages ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: |
        echo "Starting build process..."
        npm run build
        echo "Build completed. Checking dist directory..."
        ls -la
        if [ -d "dist" ]; then
          echo "✅ dist directory exists"
          ls -la dist/
          echo "Total files in dist: $(find dist -type f | wc -l)"
        else
          echo "❌ dist directory does not exist!"
          exit 1
        fi
      
    - name: Debug - Check secrets availability
      run: |
        echo "Checking if required secrets are available..."
        if [ -z "${{ secrets.HOST }}" ]; then
          echo "❌ HOST secret is missing"
          exit 1
        else
          echo "✅ HOST secret is available: ${{ secrets.HOST }}"
        fi
        
        if [ -z "${{ secrets.USERNAME }}" ]; then
          echo "❌ USERNAME secret is missing"
          exit 1
        else
          echo "✅ USERNAME secret is available: ${{ secrets.USERNAME }}"
        fi
        
        if [ -z "${{ secrets.SSH_KEY }}" ]; then
          echo "❌ SSH_KEY secret is missing"
          exit 1
        else
          echo "✅ SSH_KEY secret is available (length: ${#SSH_KEY} chars)"
        fi
        
        if [ -z "${{ secrets.PORT }}" ]; then
          echo "❌ PORT secret is missing"
          exit 1
        else
          echo "✅ PORT secret is available: ${{ secrets.PORT }}"
        fi
        
        echo "All secrets are available. Proceeding with deployment..."
      
    - name: Test basic connectivity
      run: |
        echo "Testing basic network connectivity to ${{ secrets.HOST }}..."
        
        # Test if we can reach the host at all
        if ping -c 3 ${{ secrets.HOST }} > /dev/null 2>&1; then
          echo "✅ Ping successful to ${{ secrets.HOST }}"
        else
          echo "❌ Ping failed to ${{ secrets.HOST }}"
          echo "This suggests a network connectivity issue"
        fi
        
        # Test if the port is reachable
        if nc -z -w 10 ${{ secrets.HOST }} ${{ secrets.PORT }}; then
          echo "✅ Port ${{ secrets.PORT }} is reachable on ${{ secrets.HOST }}"
        else
          echo "❌ Port ${{ secrets.PORT }} is not reachable on ${{ secrets.HOST }}"
          echo "This suggests a firewall or SSH service issue"
        fi
      
    - name: Test SSH connection with verbose output
      run: |
        echo "Testing SSH connection with verbose output..."
        
        # Create a temporary SSH key file
        echo "${{ secrets.SSH_KEY }}" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        
        # Test SSH with verbose output to see what's happening
        timeout 60 ssh -v -i /tmp/deploy_key \
          -o StrictHostKeyChecking=no \
          -o ConnectTimeout=30 \
          -o ServerAliveInterval=60 \
          -o ServerAliveCountMax=3 \
          -p ${{ secrets.PORT }} \
          ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
          "echo 'SSH connection successful'"
        
        SSH_EXIT_CODE=$?
        
        if [ $SSH_EXIT_CODE -eq 0 ]; then
          echo "✅ SSH connection test passed"
        else
          echo "❌ SSH connection test failed with exit code: $SSH_EXIT_CODE"
          echo "Exit code meanings:"
          echo "  124 = timeout"
          echo "  255 = connection refused/network error"
          echo "  1 = authentication failed"
        fi
        
        # Clean up
        rm -f /tmp/deploy_key
      
    - name: Clean deployment directory and free up space
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          echo "Cleaning up old deployment files and checking disk space..."
          
          # Show disk space before cleanup
          echo "Disk space before cleanup:"
          df -h /tmp
          
          # Clean old deployment files
          echo "Removing old deployment files..."
          rm -rf /tmp/vue-deploy/*
          rm -rf /tmp/vue-deploy/.*
          
          # Clean other temporary files if needed
          echo "Cleaning general /tmp directory..."
          find /tmp -type f -mtime +7 -delete 2>/dev/null || true
          find /tmp -type d -empty -delete 2>/dev/null || true
          
          # Show disk space after cleanup
          echo "Disk space after cleanup:"
          df -h /tmp
          
          # Check if we have enough space (at least 1GB free)
          AVAILABLE=$(df /tmp | tail -1 | awk '{print $4}')
          echo "Available space in /tmp: ${AVAILABLE}K"
          if [ "$AVAILABLE" -lt 1048576 ]; then
            echo "⚠️ Warning: Less than 1GB free space in /tmp"
            echo "Available space: $(($AVAILABLE / 1024))MB"
          else
            echo "✅ Sufficient disk space available"
          fi
          
    - name: Create deployment directory
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          echo "Creating deployment directory..."
          echo "Current user: $(whoami)"
          echo "Current directory: $(pwd)"
          
          # Try creating directory without sudo first
          mkdir -p /tmp/vue-deploy || {
            echo "Regular mkdir failed, trying with sudo..."
            sudo mkdir -p /tmp/vue-deploy
          }
          
          # Set ownership and permissions
          if [ -d "/tmp/vue-deploy" ]; then
            echo "Directory exists, setting permissions..."
            sudo chown ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /tmp/vue-deploy 2>/dev/null || chown ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /tmp/vue-deploy
            sudo chmod 755 /tmp/vue-deploy 2>/dev/null || chmod 755 /tmp/vue-deploy
          else
            echo "❌ Failed to create directory"
            exit 1
          fi
          
          echo "Verifying temporary directory..."
          ls -la /tmp/ | grep vue-deploy || echo "Directory not visible in listing"
          ls -la /tmp/vue-deploy/ || echo "Cannot access directory contents"
          
          # Test write permissions
          if touch /tmp/vue-deploy/test-file.txt 2>/dev/null && rm /tmp/vue-deploy/test-file.txt 2>/dev/null; then
            echo "✅ Directory is writable"
          else
            echo "❌ Directory is not writable, trying alternative location..."
            # Try user's home directory as fallback
            mkdir -p ~/vue-deploy
            chmod 755 ~/vue-deploy
            if touch ~/vue-deploy/test-file.txt && rm ~/vue-deploy/test-file.txt; then
              echo "✅ Using ~/vue-deploy as deployment directory"
              echo "DEPLOY_DIR=~/vue-deploy" >> $GITHUB_ENV
            else
              echo "❌ All directory creation attempts failed"
              exit 1
            fi
          fi
          
          echo "Deployment directory setup completed."
          
    - name: Debug server directory
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          echo "Debugging server directory permissions..."
          echo "Current user: $(whoami)"
          echo "User groups: $(groups)"
          echo "Checking /tmp permissions:"
          ls -la /tmp | grep vue-deploy
          echo "Checking /tmp/vue-deploy permissions:"
          ls -la /tmp/vue-deploy/
          echo "Testing write permissions:"
          touch /tmp/vue-deploy/test-write.txt && rm /tmp/vue-deploy/test-write.txt && echo "✅ Write permissions OK" || echo "❌ Write permissions FAILED"
          
    - name: Debug local dist directory
      run: |
        echo "Checking local dist directory before upload..."
        pwd
        ls -la
        echo "Contents of dist directory:"
        ls -la dist/
        echo "Total files in dist: $(find dist -type f | wc -l)"
        echo "Disk space:"
        df -h
        echo "File sizes in dist:"
        du -sh dist/*
          
    - name: Upload files with rsync
      run: |
        echo "Setting up SSH key for rsync..."
        echo "${{ secrets.SSH_KEY }}" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        
        echo "Creating deployment directory on server..."
        ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.PORT }} \
          ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
          "mkdir -p /tmp/vue-deploy && chmod 755 /tmp/vue-deploy"
        
        echo "Starting rsync upload..."
        rsync -avz -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.PORT }}" \
          --progress \
          --stats \
          dist/ \
          ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/tmp/vue-deploy/
        
        echo "Upload completed. Cleaning up SSH key..."
        rm -f /tmp/deploy_key
        
    - name: Stop services and prepare for deployment
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          echo "Preparing server for deployment..."
          
          # Stop nginx temporarily
          echo "Stopping nginx..."
          systemctl stop nginx || echo "Nginx was not running"
          
          # Remove old files
          echo "Removing old files..."
          rm -rf /var/www/html/*
          
          echo "Server ready for file deployment."
        
    - name: Finalize deployment
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          echo "Finalizing deployment..."
          
          # Remove old files
          rm -rf /var/www/html/*
          
          # With rsync, files are uploaded directly to /tmp/vue-deploy/
          echo "Moving files from /tmp/vue-deploy/ to /var/www/html/"
          ls -la /tmp/vue-deploy/
          mv /tmp/vue-deploy/* /var/www/html/
          
          # Set proper permissions
          chown -R www-data:www-data /var/www/html
          chmod -R 755 /var/www/html
          
          # Start nginx
          systemctl start nginx
          
          # Check if nginx started successfully
          if systemctl is-active --quiet nginx; then
            echo "✅ Nginx started successfully"
          else
            echo "❌ Failed to start nginx"
            systemctl status nginx
            exit 1
          fi
          
          # Verify SSL configuration is still intact
          echo "Verifying SSL configuration..."
          if grep -q "ssl_certificate" /etc/nginx/sites-available/default; then
            echo "✅ SSL configuration is preserved"
          else
            echo "⚠️  SSL configuration may have been lost"
          fi
          
          # Test HTTPS accessibility
          echo "Testing HTTPS accessibility..."
          if curl -s -o /dev/null -w "%{http_code}" https://ryanmakoni.live | grep -q "200\|301\|302"; then
            echo "✅ HTTPS is working correctly"
          else
            echo "⚠️  HTTPS may not be working"
          fi
          
          # Clean up deployment files
          echo "Cleaning up temporary deployment files..."
          rm -rf /tmp/vue-deploy
          
          # Final disk space check
          echo "Final disk space check:"
          df -h /tmp
          
          echo "🎉 Deployment completed successfully!" 